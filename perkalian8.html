
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Perkalian 8</title>
</head>
<body>

    <h1>Tabel Perkalian 8</h1>

    <ul>
        <li>NIM: 12345</li>
        <li>Nama: Pa Solihin</li>
    </ul>

    <div id="hasil"></div>

    <script>
        let angka = 8;
        let output = "";

        for (let i = 1; i <= 10; i++) {
            let hasil = angka * i;

            output += angka + " x " + i + " = " + hasil + "<br>";
        }

        document.getElementById("hasil").innerHTML = output;
    </script>

</body>
</html>
