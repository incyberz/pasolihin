
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-header bg-primary text-white text-center">
                <h3>Kalkulator Aritmatika</h3>
                <div>Pa Solihin - NIM. 12345678</div>
            </div>

            <div class="card-body p-4">

                <!-- Input Angka Pertama -->
                <div class="mb-3">
                    <label for="angka1" class="form-label">
                        Angka Pertama
                    </label>
                    <input
                        type="number"
                        id="angka1"
                        class="form-control"
                        placeholder="Masukkan angka pertama"
                        step="any"
                    >
                </div>

                <!-- Input Angka Kedua -->
                <div class="mb-3">
                    <label for="angka2" class="form-label">
                        Angka Kedua
                    </label>
                    <input
                        type="number"
                        id="angka2"
                        class="form-control"
                        placeholder="Masukkan angka kedua"
                        step="any"
                    >
                </div>

                <!-- Select Operator -->
                <div class="mb-3">
                    <label for="operator" class="form-label">
                        Pilih Operator
                    </label>
                    <select id="operator" class="form-select">
                        <option value="+">Penjumlahan (+)</option>
                        <option value="-">Pengurangan (-)</option>
                        <option value="*">Perkalian (*)</option>
                        <option value="/">Pembagian (/)</option>
                        <option value="%">Modulus (%)</option>
                        <option value="**">Pangkat (**)</option>
                    </select>
                </div>

                <!-- Tombol Hitung -->
                <button
                    class="btn btn-primary w-100"
                    onclick="hitung()"
                >
                    Hitung
                </button>

                <!-- Layar Hasil -->
                <div class="mt-4 p-3 bg-dark text-white text-center rounded">
                    <div class="small">HASIL PERHITUNGAN</div>
                    <div id="hasil" class="display-4 fw-bold">0</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function hitung() {
            const input1 = document.getElementById("angka1").value;
            const input2 = document.getElementById("angka2").value;
            const operator = document.getElementById("operator").value;
            const layarHasil = document.getElementById("hasil");

            if (input1.trim() === "" || input2.trim() === "") {
                layarHasil.textContent = "Isi kedua angka!";
                return;
            }

            const a = Number(input1);
            const b = Number(input2);
            let hasil;

            switch (operator) {
                case "+":
                    hasil = a + b;
                    break;
                case "-":
                    hasil = a - b;
                    break;
                case "*":
                    hasil = a * b;
                    break;
                case "/":
                    hasil = b === 0
                        ? "Tidak bisa dibagi 0"
                        : a / b;
                    break;
                case "%":
                    hasil = b === 0
                        ? "Modulus dengan 0 tidak valid"
                        : a % b;
                    break;
                case "**":
                    hasil = a ** b;
                    break;
            }

            if (typeof hasil === "number") {
                layarHasil.textContent = Number.isFinite(hasil)
                    ? hasil
                    : "Hasil tidak valid";
            } else {
                layarHasil.textContent = hasil;
            }
        }
    </script>

</body>
</html>
