<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">Kalkulator Sistem Bilangan</h3>
                    </div>

                    <div class="card-body p-4">

                        <!-- Input Bilangan -->
                        <div class="mb-3">
                            <label for="bilangan" class="form-label">
                                Masukkan Bilangan
                            </label>
                            <input
                                type="text"
                                id="bilangan"
                                class="form-control form-control-lg"
                                placeholder="Contoh: 1010"
                            >
                        </div>

                        <!-- Sistem Bilangan Input -->
                        <div class="mb-3">
                            <label for="basisInput" class="form-label">
                                Sistem Bilangan Input
                            </label>
                            <select id="basisInput" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="10" selected>Desimal (Basis 10)</option>
                                <option value="16">Heksadesimal (Basis 16)</option>
                            </select>
                        </div>

                        <!-- Tombol Konversi -->
                        <div class="d-grid mb-4">
                            <button
                                type="button"
                                class="btn btn-primary btn-lg"
                                onclick="konversikan()"
                            >
                                Konversi
                            </button>
                        </div>

                        <!-- Sistem Bilangan Hasil -->
                        <div class="mb-3">
                            <label for="basisOutput" class="form-label">
                                Konversi ke Sistem Bilangan
                            </label>
                            <select id="basisOutput" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="10">Desimal (Basis 10)</option>
                                <option value="16" selected>
                                    Heksadesimal (Basis 16)
                                </option>
                            </select>
                        </div>

                        <!-- Label Hasil -->
                        <div class="alert alert-success text-center mb-0">
                            <div class="text-muted mb-2">Hasil Konversi</div>
                            <div id="hasil" class="fs-1 fw-bold text-break">
                                -
                            </div>
                        </div>

                        <!-- Pesan Error -->
                        <div id="pesan" class="text-danger mt-3"></div>

                    </div>

                    <div class="card-footer text-center text-muted">
                        Matematika Informatika
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function konversikan() {
            const bilangan = document.getElementById("bilangan")
                .value.trim();

            const basisInput = parseInt(
                document.getElementById("basisInput").value
            );

            const basisOutput = parseInt(
                document.getElementById("basisOutput").value
            );

            const hasil = document.getElementById("hasil");
            const pesan = document.getElementById("pesan");

            // Reset pesan
            pesan.textContent = "";
            hasil.textContent = "-";

            // Validasi input kosong
            if (bilangan === "") {
                pesan.textContent = "Masukkan bilangan terlebih dahulu!";
                return;
            }

            // Validasi karakter sesuai basis
            const pola = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9a-fA-F]+$/
            };

            if (!pola[basisInput].test(bilangan)) {
                pesan.textContent =
                    "Bilangan tidak valid untuk sistem bilangan input yang dipilih!";
                return;
            }

            // Konversi ke bilangan desimal (BigInt)
            const nilaiDesimal = parseInt(basisInput) === 10
                ? BigInt(bilangan)
                : BigInt(
                    "0" + "x"
                );

            // Konversi berdasarkan basis input
            let nilai;

            if (basisInput === 10) {
                nilai = BigInt(bilangan);
            } else if (basisInput === 2) {
                nilai = BigInt("0b" + bilangan);
            } else if (basisInput === 8) {
                nilai = BigInt("0o" + bilangan);
            } else {
                nilai = BigInt("0x" + bilangan);
            }

            // Konversi ke basis output
            const hasilKonversi = nilai
                .toString(basisOutput)
                .toUpperCase();

            // Tampilkan hasil
            hasil.textContent = hasilKonversi;
        }
    </script>

</body>
</html>
